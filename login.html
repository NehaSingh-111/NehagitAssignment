<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial;
            background-color: #e8f0fe;
            text-align: center;
        }

        .form-box {
            width: 350px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 95%;
            padding: 10px;
            background: #34495e;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Login</h2>
    <form action="loginServlet" method="post">
        <input type="text" name="username" placeholder="Enter Username" required><br>
        <input type="password" name="password" placeholder="Enter Password" required><br>
        <button type="submit">Login</button>
    </form>
    <p>New user? <a href="register.html">Register Here</a></p>
</div>

</body>
</html>
